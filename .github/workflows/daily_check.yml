name: Controllo Comunicati Pergolettese

on:
  schedule:
    # Doppio trigger UTC per coprire sia ora solare (UTC+1) che legale (UTC+2)
    # verso le 08:00 italiane, evitando la coda delle :00
    - cron: "55 5 * * *"
    - cron: "55 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controllo-comunicati-pergolettese
  cancel-in-progress: false

jobs:
  check-comunicati:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Allinea al branch main più recente
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui controllo comunicati
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python main.py

      - name: Aggiorna seen.json su GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: aggiorna comunicati visti [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
